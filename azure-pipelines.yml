name: chart-ccd pipeline

trigger:
  branches:
    include:
      - refs/tags/*

pr:
  branches:
    include:
      - master

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: 'hmcts'

jobs:

# ------------------------------------------------------------------
# TEMPORARY DEBUG JOB
# Used to investigate Helm lint failure for ccd-data-store-api chart.
# Remove once the issue has been identified.
# ------------------------------------------------------------------
- job: DebugCCD
  displayName: 'Debug CCD Helm chart'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - checkout: self
      clean: true

    - task: HelmInstaller@1
      displayName: 'Install Helm 4.2.4'
      inputs:
        helmVersionToInstall: 4.2.4

    - task: AzureCLI@2
      displayName: 'Debug CCD Helm dependencies'
      inputs:
        azureSubscription: azurerm-prod
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e

          echo "========================================"
          echo "Helm version"
          echo "========================================"
          helm version

          echo
          echo "========================================"
          echo "Login to HMCTS ACR"
          echo "========================================"
          az acr login --name hmctsprod

          echo
          echo "========================================"
          echo "CCD directory BEFORE dependency update"
          echo "========================================"
          ls -lah ccd
          ls -lah ccd/charts || true

          echo
          echo "========================================"
          echo "CCD Chart.yaml"
          echo "========================================"
          cat ccd/Chart.yaml

          echo
          echo "========================================"
          echo "Updating CCD dependencies"
          echo "========================================"
          helm dependency update ccd

          echo
          echo "========================================"
          echo "CCD charts AFTER dependency update"
          echo "========================================"
          ls -lah ccd/charts

          echo
          echo "========================================"
          echo "Data Store chart packages"
          echo "========================================"
          find ccd \
            -name 'ccd-data-store-api-*.tgz' \
            -exec ls -lh {} \;

          echo
          echo "========================================"
          echo "Largest files under CCD"
          echo "========================================"
          find ccd -type f -exec du -h {} + \
            | sort -rh \
            | head -30

          echo
          echo "========================================"
          echo "Inspect ccd-data-store-api-2.0.44"
          echo "========================================"

          DATASTORE_CHART=$(find ccd \
            -name 'ccd-data-store-api-2.0.44.tgz' \
            | head -1)

          if [ -n "$DATASTORE_CHART" ]; then

            echo "Found chart:"
            echo "$DATASTORE_CHART"

            echo
            echo "Chart size:"
            ls -lh "$DATASTORE_CHART"

            echo
            echo "Largest files contained in chart:"
            tar -tzvf "$DATASTORE_CHART" \
              | sort -k3 -nr \
              | head -30

            echo
            echo "Extracting chart for inspection..."

            rm -rf /tmp/ccd-data-store-chart
            mkdir -p /tmp/ccd-data-store-chart

            tar -xzf "$DATASTORE_CHART" \
              -C /tmp/ccd-data-store-chart

            echo
            echo "Largest extracted files/directories:"
            du -ah /tmp/ccd-data-store-chart \
              | sort -rh \
              | head -30

          else

            echo "ccd-data-store-api-2.0.44.tgz was NOT found."

          fi

          echo
          echo "========================================"
          echo "Running Helm lint"
          echo "========================================"

          helm lint ccd


# ------------------------------------------------------------------
# EXISTING CCD VALIDATION
# ------------------------------------------------------------------
- job: Validate
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - template: steps/charts/validate.yaml@cnp-azuredevops-libraries
      parameters:
        chartName: ccd
        chartReleaseName: chart-ccd-ci-test
        chartNamespace: chart-tests
        helmInstallTimeout: "1000"
        aksCluster: cft-preview-00-aks
        aksResourceGroup: cft-preview-00-rg


# ------------------------------------------------------------------
# EXISTING CCD CORE VALIDATION
# ------------------------------------------------------------------
- job: ValidateCore
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - checkout: self
      clean: true

    - task: HelmInstaller@1
      displayName: 'Install Helm 4.2.4'
      inputs:
        helmVersionToInstall: 4.2.4

    - task: AzureCLI@2
      displayName: 'Lint and package ccd-core'
      inputs:
        azureSubscription: azurerm-prod
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          az acr login --name hmctsprod
          helm dependency update ccd-core
          helm lint ccd-core
          helm package ccd-core


# ------------------------------------------------------------------
# EXISTING CCD RELEASE
# ------------------------------------------------------------------
- job: Release
  # Make sure we have a tag to run this job
  condition: >
    and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/')
      )

  dependsOn:
    - Validate
    - ValidateCore

  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - template: steps/charts/release.yaml@cnp-azuredevops-libraries
      parameters:
        chartName: ccd
        chartReleaseName: chart-ccd
        chartNamespace: chart-tests
        aksCluster: cft-preview-00-aks
        aksResourceGroup: cft-preview-00-rg


# ------------------------------------------------------------------
# EXISTING CCD CORE RELEASE
# ------------------------------------------------------------------
- job: ReleaseCore
  # Make sure we have a tag to run this job
  condition: >
    and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/')
      )

  dependsOn:
    - Validate
    - ValidateCore

  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - template: steps/charts/release.yaml@cnp-azuredevops-libraries
      parameters:
        chartName: ccd-core
        chartReleaseName: chart-ccd-core
        chartNamespace: chart-tests
        aksCluster: cft-preview-00-aks
        aksResourceGroup: cft-preview-00-rg