name: chart-ccd pipeline

trigger:
  branches:
    include:
      - refs/tags/*

pr:
  branches:
    include:
      - master

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: 'hmcts'

jobs:

# ================================================================
# TEMPORARY DEBUG JOB
#
# Tests the same CCD chart using Helm 3 and Helm 4.
# This is intended to determine whether the 5 MiB chart-size
# failure is specific to Helm 4.
# ================================================================
- job: DebugCCD
  displayName: 'Compare CCD lint with Helm 3 and Helm 4'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - checkout: self
      clean: true

    # ------------------------------------------------------------
    # HELM 3
    # ------------------------------------------------------------
    - task: HelmInstaller@1
      displayName: 'Install Helm 3.18.6'
      inputs:
        helmVersionToInstall: 3.18.6

    - task: AzureCLI@2
      displayName: 'Download dependencies and test with Helm 3'
      inputs:
        azureSubscription: azurerm-prod
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e

          echo "========================================"
          echo "HELM 3 TEST"
          echo "========================================"

          echo
          echo "Helm version:"
          helm version

          echo
          echo "========================================"
          echo "Login to HMCTS ACR"
          echo "========================================"

          az acr login --name hmctsprod

          echo
          echo "========================================"
          echo "CCD directory BEFORE dependency update"
          echo "========================================"

          ls -lah ccd

          echo
          echo "Existing charts directory:"
          ls -lah ccd/charts || true

          echo
          echo "========================================"
          echo "CCD Chart.yaml"
          echo "========================================"

          cat ccd/Chart.yaml

          echo
          echo "========================================"
          echo "Updating CCD dependencies"
          echo "========================================"

          helm dependency update ccd

          echo
          echo "========================================"
          echo "All downloaded chart dependencies"
          echo "========================================"

          ls -lah ccd/charts

          echo
          echo "========================================"
          echo "All downloaded chart sizes"
          echo "========================================"

          du -h ccd/charts/*.tgz | sort -rh

          echo
          echo "========================================"
          echo "Data Store chart"
          echo "========================================"

          DATASTORE_CHART="ccd/charts/ccd-data-store-api-2.0.44.tgz"

          if [ -f "$DATASTORE_CHART" ]; then

            echo "Found:"
            echo "$DATASTORE_CHART"

            echo
            echo "Human-readable size:"
            ls -lh "$DATASTORE_CHART"

            echo
            echo "Exact file information:"
            ls -l "$DATASTORE_CHART"

            DATASTORE_SIZE=$(stat -c%s "$DATASTORE_CHART")

            echo
            echo "Actual chart size:"
            echo "${DATASTORE_SIZE} bytes"

            echo
            echo "Helm error limit:"
            echo "5242880 bytes"

            if [ "$DATASTORE_SIZE" -gt 5242880 ]; then
              echo
              echo "CONFIRMED: Data Store chart exceeds 5 MiB"
              echo "Amount over limit:"
              echo "$((DATASTORE_SIZE - 5242880)) bytes"
            else
              echo
              echo "Data Store chart does NOT exceed 5 MiB"
            fi

            echo
            echo "========================================"
            echo "Largest files inside Data Store chart"
            echo "========================================"

            tar -tzvf "$DATASTORE_CHART" \
              | sort -k3 -nr \
              | head -30 || true

            echo
            echo "========================================"
            echo "Extract Data Store chart"
            echo "========================================"

            rm -rf /tmp/ccd-data-store-chart
            mkdir -p /tmp/ccd-data-store-chart

            tar -xzf "$DATASTORE_CHART" \
              -C /tmp/ccd-data-store-chart

            echo
            echo "Largest extracted files/directories:"

            du -ah /tmp/ccd-data-store-chart \
              | sort -rh \
              | head -30 || true

          else

            echo
            echo "ERROR: Data Store chart was not found:"
            echo "$DATASTORE_CHART"

            echo
            echo "Searching for any Data Store chart..."

            find ccd \
              -name 'ccd-data-store-api-*.tgz' \
              -exec ls -lh {} \;

          fi

          echo
          echo "========================================"
          echo "RUNNING HELM 3 LINT"
          echo "========================================"

          helm version

          set +e

          helm lint ccd

          HELM3_RESULT=$?

          set -e

          echo
          echo "========================================"
          echo "HELM 3 RESULT"
          echo "========================================"

          echo "Helm 3 lint exit code: $HELM3_RESULT"

          if [ "$HELM3_RESULT" -eq 0 ]; then
            echo "HELM 3 RESULT: PASS"
          else
            echo "HELM 3 RESULT: FAIL"
          fi

          # Do not fail the diagnostic job here because we also
          # want to run the Helm 4 test.
          exit 0


    # ------------------------------------------------------------
    # HELM 4
    #
    # Install Helm 4, but DO NOT run dependency update again.
    # This means Helm 4 tests exactly the same ccd/charts files
    # downloaded during the Helm 3 test above.
    # ------------------------------------------------------------
    - task: HelmInstaller@1
      displayName: 'Install Helm 4.2.4'
      inputs:
        helmVersionToInstall: 4.2.4

    - task: AzureCLI@2
      displayName: 'Test same CCD chart with Helm 4'
      inputs:
        azureSubscription: azurerm-prod
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e

          echo "========================================"
          echo "HELM 4 TEST"
          echo "========================================"

          echo
          echo "Helm version:"
          helm version

          echo
          echo "========================================"
          echo "Confirm existing Data Store chart"
          echo "========================================"

          DATASTORE_CHART="ccd/charts/ccd-data-store-api-2.0.44.tgz"

          if [ -f "$DATASTORE_CHART" ]; then

            echo "Using SAME chart downloaded previously:"
            ls -lh "$DATASTORE_CHART"

            DATASTORE_SIZE=$(stat -c%s "$DATASTORE_CHART")

            echo
            echo "Exact size:"
            echo "${DATASTORE_SIZE} bytes"

          else

            echo "ERROR: Expected Data Store chart is missing."
            exit 1

          fi

          echo
          echo "========================================"
          echo "RUNNING HELM 4 LINT"
          echo "========================================"

          set +e

          helm lint ccd

          HELM4_RESULT=$?

          set -e

          echo
          echo "========================================"
          echo "HELM 4 RESULT"
          echo "========================================"

          echo "Helm 4 lint exit code: $HELM4_RESULT"

          if [ "$HELM4_RESULT" -eq 0 ]; then
            echo "HELM 4 RESULT: PASS"
          else
            echo "HELM 4 RESULT: FAIL"
          fi

          echo
          echo "========================================"
          echo "DEBUG TEST COMPLETE"
          echo "========================================"

          echo "Check the Helm 3 and Helm 4 results above."

          # Keep this diagnostic job green so that both results
          # can be inspected without this temporary job blocking.
          exit 0


# ================================================================
# EXISTING CCD VALIDATION
# ================================================================
- job: Validate
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - template: steps/charts/validate.yaml@cnp-azuredevops-libraries
      parameters:
        chartName: ccd
        chartReleaseName: chart-ccd-ci-test
        chartNamespace: chart-tests
        helmInstallTimeout: "1000"
        aksCluster: cft-preview-00-aks
        aksResourceGroup: cft-preview-00-rg


# ================================================================
# EXISTING CCD CORE VALIDATION
# ================================================================
- job: ValidateCore
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - checkout: self
      clean: true

    - task: HelmInstaller@1
      displayName: 'Install Helm 4.2.4'
      inputs:
        helmVersionToInstall: 4.2.4

    - task: AzureCLI@2
      displayName: 'Lint and package ccd-core'
      inputs:
        azureSubscription: azurerm-prod
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          az acr login --name hmctsprod
          helm dependency update ccd-core
          helm lint ccd-core
          helm package ccd-core


# ================================================================
# EXISTING CCD RELEASE
# ================================================================
- job: Release
  # Make sure we have a tag to run this job
  condition: >
    and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/')
      )

  dependsOn:
    - Validate
    - ValidateCore

  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - template: steps/charts/release.yaml@cnp-azuredevops-libraries
      parameters:
        chartName: ccd
        chartReleaseName: chart-ccd
        chartNamespace: chart-tests
        aksCluster: cft-preview-00-aks
        aksResourceGroup: cft-preview-00-rg


# ================================================================
# EXISTING CCD CORE RELEASE
# ================================================================
- job: ReleaseCore
  # Make sure we have a tag to run this job
  condition: >
    and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/')
      )

  dependsOn:
    - Validate
    - ValidateCore

  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - template: steps/charts/release.yaml@cnp-azuredevops-libraries
      parameters:
        chartName: ccd-core
        chartReleaseName: chart-ccd-core
        chartNamespace: chart-tests
        aksCluster: cft-preview-00-aks
        aksResourceGroup: cft-preview-00-rg